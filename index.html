<style>
  :root{
    --bg: #05060a;
    --bg-soft: #0a0c14;
    --line: rgba(255,255,255,0.10);
    --text: #f5f6fa;
    --text-dim: #8b90a3;
    --blue: #3b5bfd;
    --cyan: #22d9c6;
    --violet: #7b3ff2;
    --magenta: #ef2f77;
    --pink: #ff5fa2;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* ambient background glow */
  .glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(59,91,253,0.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 15% 70%, rgba(239,47,119,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 70%, rgba(34,217,198,0.10), transparent 60%);
  }
  .wrap{ position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:0 32px; }

  /* ---------- HERO ---------- */
  header.hero{
    padding:96px 0 64px;
    text-align:center;
  }
  .eyebrow-line{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-bottom:40px;
    opacity:0; animation: fadeUp .7s ease forwards;
  }
  .eyebrow-line .bar{ width:64px; height:1px; background:linear-gradient(90deg, transparent, var(--blue)); }
  .eyebrow-line .bar.right{ background:linear-gradient(90deg, var(--magenta), transparent); }
  .eyebrow-line span{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px; letter-spacing:0.35em; color:var(--text-dim); font-weight:500;
  }
  .wordmark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(56px, 12vw, 128px);
    letter-spacing:0.05em;
    line-height:1;
    display:flex; justify-content:center; align-items:center;
    opacity:0; animation: fadeUp .8s ease .1s forwards;
  }
  .wordmark .x{
    background:linear-gradient(120deg, var(--blue), #b6c6ff 45%, var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .group{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:clamp(16px, 3vw, 26px);
    letter-spacing:0.55em;
    margin-top:6px;
    color:var(--text);
    opacity:0; animation: fadeUp .8s ease .22s forwards;
  }
  .group .rule{ display:inline-block; width:36px; height:1px; vertical-align:middle; margin:0 16px 4px; }
  .group .rule.l{ background:linear-gradient(90deg, transparent, var(--blue)); }
  .group .rule.r{ background:linear-gradient(90deg, var(--violet), transparent); }
  .tagline{
    margin-top:28px;
    font-family:'Space Grotesk', sans-serif;
    font-size:clamp(12px, 1.6vw, 14px);
    letter-spacing:0.28em;
    font-weight:500;
    background:linear-gradient(90deg, var(--blue), var(--violet) 55%, var(--magenta));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; animation: fadeUp .8s ease .34s forwards;
  }

  /* ---------- STRUCTURE / SIGNATURE ELEMENT ---------- */
  .tree{
    display:flex; flex-direction:column; align-items:center;
    margin:56px 0 8px;
    opacity:0; animation: fadeUp .8s ease .44s forwards;
  }
  .tree .trunk{ width:1px; height:40px; background:var(--line); }
  .tree svg{ display:block; }

  /* ---------- VENTURES GRID ---------- */
  .ventures{
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    gap:0;
    margin-top:0;
    padding-bottom:100px;
  }
  .divider-v{ background:var(--line); }
  .venture{
    padding:44px 40px 48px;
    text-align:center;
    display:flex; flex-direction:column; align-items:center;
    opacity:0; animation: fadeUp .7s ease forwards;
    position:relative;
  }
  .venture.cleavenir{ animation-delay:.55s; }
  .venture.hakily{ animation-delay:.65s; }
  .venture .logo-cleavenir{ height:96px; width:auto; margin-bottom:18px; }
  .venture .logo-hakily{
    height:auto; width:100%; max-width:300px; margin-bottom:22px;
    border-radius:10px; /* smooths the seam if the flat bg isn't a perfect pixel match */
  }
  .venture h2{
    position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); /* sr-only, image carries the visible wordmark */
  }
  .venture .divider{
    width:40px; height:2px; border-radius:2px; margin:14px 0 20px;
  }
  .venture.cleavenir .divider{ background:linear-gradient(90deg, var(--magenta), var(--cyan)); }
  .venture.hakily .divider{ background:linear-gradient(90deg, var(--blue), var(--cyan)); }
  .venture p{
    color:var(--text-dim);
    font-size:16px;
    line-height:1.55;
    max-width:280px;
    margin-bottom:30px;
  }
  .venture a.cta{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    color:var(--bg);
    text-decoration:none;
    padding:13px 30px;
    border-radius:999px;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .venture.cleavenir a.cta{ background:linear-gradient(90deg, var(--magenta), var(--pink)); box-shadow:0 8px 24px -8px rgba(239,47,119,0.5); }
  .venture.hakily a.cta{ background:linear-gradient(90deg, var(--blue), var(--cyan)); box-shadow:0 8px 24px -8px rgba(34,217,198,0.4); }
  .venture a.cta:hover{ transform:translateY(-2px); }
  .venture a.cta:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }

  /* ---------- FOOTER ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:36px 0 48px;
  }
  footer .row{
    display:flex; align-items:center; justify-content:center; gap:16px;
    flex-wrap:wrap;
  }
  footer .bar{ width:56px; height:1px; background:var(--line); }
  footer span{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px; letter-spacing:0.3em; color:var(--text-dim); font-weight:500;
  }
  footer .legal-link{
    display:block;
    text-align:center;
    margin-top:20px;
  }
  footer .legal-link a{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--text-dim);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color .2s ease, border-color .2s ease;
  }
  footer .legal-link a:hover{ color:var(--text); border-color:var(--line); }
  footer .legal-link a:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }

  /* ---------- SKIP LINK ---------- */
  .skip-link{
    position:absolute; left:16px; top:-60px;
    background:var(--bg-soft); color:var(--text);
    padding:10px 18px; border-radius:8px; border:1px solid var(--line);
    font-family:'Space Grotesk', sans-serif; font-size:13px;
    text-decoration:none; z-index:100;
    transition:top .2s ease;
  }
  .skip-link:focus{ top:16px; }

  a:focus-visible{ outline:2px solid var(--text); outline-offset:3px; }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-delay:0ms !important; scroll-behavior:auto !important; }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 720px){
    header.hero{ padding:72px 0 40px; }
    .ventures{ grid-template-columns:1fr; }
    .divider-v{ height:1px; width:80%; margin:0 auto; }
    .venture{ padding:40px 24px; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main">Aller au contenu</a>

<div class="glow"></div>

<div class="wrap">

  <header class="hero">
    <div class="eyebrow-line">
      <span class="bar"></span>
      <span>HOLDING</span>
      <span class="bar right"></span>
    </div>

    <h1 class="wordmark" aria-label="Axya">A<span class="x">X</span>YA</h1>
    <div class="group">
      <span class="rule l"></span>GROUP<span class="rule r"></span>
    </div>

    <p class="tagline">INNOVER AUJOURD'HUI, CONSTRUIRE DEMAIN</p>

    <div class="tree" aria-hidden="true">
      <div class="trunk"></div>
      <svg width="240" height="34" viewBox="0 0 240 34" fill="none">
        <path d="M20 0 V14 C20 24 28 24 40 24 H200 C212 24 220 24 220 14 V0"
              stroke="var(--line)" stroke-width="1"/>
        <line x1="20" y1="24" x2="20" y2="34" stroke="var(--line)" stroke-width="1"/>
        <line x1="220" y1="24" x2="220" y2="34" stroke="var(--line)" stroke-width="1"/>
      </svg>
    </div>
  </header>

  <main id="main">
    <section class="ventures" aria-label="Nos projets">

      <div class="venture cleavenir">
        <img class="logo-cleavenir" src="assets/cleavenir-logo.png" alt="CléAvenir" width="384" height="455">
        <h2>CléAvenir</h2>
        <div class="divider"></div>
        <p>Plateforme d'orientation intelligente pour aider les jeunes à trouver leur voie.</p>
        <a class="cta" href="https://cleavenir.com" target="_blank" rel="noopener">cleavenir.com</a>
      </div>

      <div class="divider-v" aria-hidden="true"></div>

      <div class="venture hakily">
        <img class="logo-hakily" src="assets/hakily-logo.png" alt="Hakily" width="1166" height="285">
        <h2>Hakily</h2>
        <div class="divider"></div>
        <p>Agents IA et automatisations pour les TPE &amp; PME.</p>
        <a class="cta" href="https://hakily.fr" target="_blank" rel="noopener">hakily.fr</a>
      </div>

    </section>
  </main>

  <footer>
    <div class="row">
      <span class="bar"></span>
      <span>AXYA GROUP</span>
      <span class="bar"></span>
    </div>
    <p class="legal-link"><a href="/mentions-legales/">Mentions légales</a></p>
  </footer>

</div>

</body>
